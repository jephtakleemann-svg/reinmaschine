<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarte Reimemaschine – Reime finden & Gedichte konfigurieren</title>
  <meta name="description" content="Reimwörter finden oder vollständige Gedichte und Songtexte nach Anlass, Name und Stichworten verfassen lassen. Mit Audio-Vorlesefunktion.">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --tag-bg: #eef2ff;
      --tag-hover: #e0e7ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 36px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 0 0 24px 0;
      font-size: 15px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04);
    }
    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e2e8f0;
      color: var(--muted);
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 11px 13px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      background: #ffffff;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }
    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit-btn:hover {
      background: var(--primary-hover);
    }
    .results {
      margin-top: 28px;
    }
    .category-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .category-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .word-chip {
      display: inline-flex;
      align-items: center;
      background: var(--tag-bg);
      color: var(--primary);
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .word-chip:hover {
      background: var(--tag-hover);
    }
    .speaker-btn {
      margin-left: 8px;
      font-size: 14px;
      opacity: 0.65;
      cursor: pointer;
    }
    .speaker-btn:hover {
      opacity: 1;
    }
    /* Gedicht-Box */
    .poem-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      line-height: 1.8;
      font-size: 16px;
      font-style: italic;
      color: #1e293b;
      margin-bottom: 16px;
    }
    .poem-action-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 20px;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Smarte Reimemaschine</h1>
  <p class="subtitle">Reimwörter suchen oder passende Gedichte & Songtexte verfassen.</p>
  
  <div class="card">
    <div class="tab-nav">
      <button class="tab-btn active" id="tabPoemBtn" onclick="switchTab('poem')">Gedicht & Song dichten</button>
      <button class="tab-btn" id="tabWordBtn" onclick="switchTab('word')">Einzelne Reimwörter</button>
    </div>

    <!-- Modus 1: Gedicht-Konfigurator -->
    <div id="poemMode">
      <div class="grid-2">
        <div>
          <label>Anlass / Thema</label>
          <select id="poemTheme">
            <option value="Geburtstag" selected>Geburtstag allgemein</option>
            <option value="Runder Geburtstag">Runder Geburtstag (50., 60., ...)</option>
            <option value="Hochzeit & Liebe">Hochzeit & Liebe</option>
            <option value="Songtext / Rap">Songtext / Rap</option>
            <option value="Lustig & Humorvoll">Lustig & Frech</option>
            <option value="Abschied & Rente">Abschied & Ruhestand</option>
            <option value="Weihnachten & Neujahr">Weihnachten & Neujahr</option>
          </select>
        </div>
        <div>
          <label>Umfang / Zeilen</label>
          <select id="poemLinesCount">
            <option value="2">2 Zeilen (Kurzer Reim)</option>
            <option value="4" selected>4 Zeilen (1 Strophe)</option>
            <option value="8">8 Zeilen (2 Strophen)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Details, Name & Alter (Worum geht es genau?)</label>
        <input type="text" id="poemDetails" placeholder="z. B. Für Thomas zum 50., grillt gerne, fährt Motorrad">
      </div>

      <div class="form-group">
        <label>Wörter, die unbedingt vorkommen sollen (optional)</label>
        <input type="text" id="poemKeywords" placeholder="z. B. Bier, Harley, Legende, Glück">
      </div>

      <div class="grid-3">
        <div>
          <label>Erste Zeile schon im Kopf? (optional)</label>
          <input type="text" id="poemFirstLine" placeholder="z. B. Heut trinken wir auf fünfzig Jahr...">
        </div>
        <div>
          <label>Sprache</label>
          <select id="poemLang">
            <option value="de" selected>Deutsch</option>
            <option value="en">Englisch</option>
            <option value="es">Spanisch</option>
            <option value="fr">Französisch</option>
          </select>
        </div>
      </div>

      <button class="submit-btn" onclick="generatePoem()">Passenden Vers dichten</button>
    </div>

    <!-- Modus 2: Wortsuche -->
    <div id="wordMode" style="display: none;">
      <div class="grid-3">
        <div>
          <label>Suchwort</label>
          <input type="text" id="wordInput" placeholder="z. B. Sommer, Herz, Traum...">
        </div>
        <div>
          <label>Sprache</label>
          <select id="wordLang">
            <option value="de" selected>Deutsch</option>
            <option value="en">Englisch</option>
            <option value="es">Spanisch</option>
            <option value="fr">Französisch</option>
          </select>
        </div>
      </div>
      <button class="submit-btn" onclick="findRhymes()">Reime suchen</button>
    </div>
  </div>

  <div class="results" id="results"></div>

  <footer>
    <a href="/impressum.html">Impressum</a> | <a href="/datenschutz.html">Datenschutz</a>
  </footer>
</div>

<script>
  let currentPoemText = "";

  function switchTab(tab) {
    const poemMode = document.getElementById('poemMode');
    const wordMode = document.getElementById('wordMode');
    const tabPoemBtn = document.getElementById('tabPoemBtn');
    const tabWordBtn = document.getElementById('tabWordBtn');
    document.getElementById('results').innerHTML = '';

    if (tab === 'poem') {
      poemMode.style.display = 'block';
      wordMode.style.display = 'none';
      tabPoemBtn.classList.add('active');
      tabWordBtn.classList.remove('active');
    } else {
      poemMode.style.display = 'none';
      wordMode.style.display = 'block';
      tabWordBtn.classList.add('active');
      tabPoemBtn.classList.remove('active');
      document.getElementById('wordInput').focus();
    }
  }

  // 1. Gedicht generieren
  async function generatePoem() {
    const theme = document.getElementById('poemTheme').value;
    const linesCount = document.getElementById('poemLinesCount').value;
    const details = document.getElementById('poemDetails').value.trim();
    const keywords = document.getElementById('poemKeywords').value.trim();
    const firstLine = document.getElementById('poemFirstLine').value.trim();
    const lang = document.getElementById('poemLang').value;
    const container = document.getElementById('results');

    container.innerHTML = '<p class="empty">Dein Gedicht wird mit passenden Reimen verfasst...</p>';

    const params = new URLSearchParams({
      theme: theme,
      lines_count: linesCount,
      lang: lang
    });
    if (details) params.append('details', details);
    if (keywords) params.append('keywords', keywords);
    if (firstLine) params.append('first_line', firstLine);

    try {
      const res = await fetch(`/api/generate-poem?${params.toString()}`);
      const data = await res.json();

      if (data.error || !data.poem_lines || data.poem_lines.length === 0) {
        container.innerHTML = '<p class="empty">Konnte kein Gedicht erstellen. Bitte Angaben anpassen.</p>';
        return;
      }

      currentPoemText = data.poem_lines.join('\n');

      container.innerHTML = `
        <div class="category-block">
          <div class="category-title">
            <span>Dein Gedicht (${theme})</span>
            <span>${data.poem_lines.length} Zeilen</span>
          </div>
          <div class="poem-box">
            ${data.poem_lines.map(l => `<div>${l}</div>`).join('')}
          </div>
          <div class="poem-action-bar">
            <button class="btn-secondary" onclick="speakText(currentPoemText, '${lang}')">🔊 Laut vorlesen</button>
            <button class="btn-secondary" onclick="copyPoem()">📋 Gedicht kopieren</button>
          </div>
        </div>
      `;
    } catch (e) {
      container.innerHTML = '<p class="empty">Verbindungsfehler zum Server.</p>';
    }
  }

  function copyPoem() {
    navigator.clipboard.writeText(currentPoemText);
    alert("Gedicht in die Zwischenablage kopiert!");
  }

  // 2. Einzelne Reime
  async function findRhymes() {
    const word = document.getElementById('wordInput').value.trim();
    const lang = document.getElementById('wordLang').value;
    const container = document.getElementById('results');

    if (!word) {
      container.innerHTML = '<p class="empty">Bitte gib ein Wort ein.</p>';
      return;
    }

    container.innerHTML = '<p class="empty">Suche Reime...</p>';

    try {
      const res = await fetch(`/api/rhyme?word=${encodeURIComponent(word)}&lang=${encodeURIComponent(lang)}`);
      const data = await res.json();

      const exact = data.categories?.exact || [];
      const multi = data.categories?.multisyllable || [];
      const near = data.categories?.near || [];

      let html = '';
      if (exact.length) html += renderWordBlock('Exakte Reime', exact, lang);
      if (multi.length) html += renderWordBlock('Mehrsilbige Reime', multi, lang);
      if (near.length) html += renderWordBlock('Halbreime', near, lang);

      container.innerHTML = html || '<p class="empty">Keine Reime gefunden.</p>';
    } catch (e) {
      container.innerHTML = '<p class="empty">Verbindungsfehler zum Server.</p>';
    }
  }

  function renderWordBlock(title, words, lang) {
    return `
      <div class="category-block">
        <div class="category-title">${title} (${words.length})</div>
        <div class="word-cloud">
          ${words.map(w => `
            <span class="word-chip">
              <span>${w}</span>
              <span class="speaker-btn" onclick="speakText('${w}', '${lang}')">🔊</span>
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }

  function speakText(text, lang) {
    if (!('speechSynthesis' in window)) return;
    const mapping = { de: 'de-DE', en: 'en-US', es: 'es-ES', fr: 'fr-FR' };
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = mapping[lang] || 'de-DE';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
</script>

</body>
</html>
