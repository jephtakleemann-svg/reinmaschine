<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarte Reimemaschine & Lyrik-Generator</title>
  <meta name="description" content="Lyrik, Gedichte und Reime per KI.">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --tag-bg: #eef2ff;
      --tag-hover: #e0e7ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 36px 16px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 700px; }
    h1 { font-size: 28px; font-weight: 800; text-align: center; margin: 0 0 6px 0; }
    .subtitle { text-align: center; color: var(--muted); margin: 0 0 24px 0; font-size: 15px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); }
    .tab-nav { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px 14px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; color: var(--muted); transition: all 0.15s ease; }
    .tab-btn.active { background: var(--primary); color: #ffffff; }
    .form-group { margin-bottom: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 11px 13px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; outline: none; background: #ffffff; }
    input:focus, select:focus { border-color: var(--primary); }
    .submit-btn { width: 100%; background: var(--primary); color: white; font-size: 16px; font-weight: 600; padding: 14px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.15s; margin-top: 10px; }
    .submit-btn:hover { background: var(--primary-hover); }
    .results { margin-top: 28px; }
    .category-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .category-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .word-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
    .word-chip { display: inline-flex; align-items: center; background: var(--tag-bg); color: var(--primary); font-weight: 600; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .word-chip:hover { background: var(--tag-hover); }
    .speaker-btn { margin-left: 8px; font-size: 14px; opacity: 0.65; cursor: pointer; }
    .poem-box { background: #ffffff; border: 1px solid var(--border); border-radius: 12px; padding: 22px; line-height: 1.8; font-size: 16px; font-style: italic; color: #1e293b; margin-bottom: 16px; white-space: pre-wrap; }
    .poem-action-bar { display: flex; gap: 10px; margin-top: 14px; }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-secondary:hover { background: #e2e8f0; }
    .empty { text-align: center; color: var(--muted); margin-top: 20px; font-weight: 500;}
  </style>
</head>
<body>

<div class="container">
  <h1>Smarte Reimemaschine & Lyrik</h1>
  <p class="subtitle">Ein Wort reimt sich nie allein – schreibe ganze Gedichte nach Maß.</p>
  
  <div class="card">
    <div class="tab-nav">
      <button class="tab-btn active" id="tabPoemBtn" onclick="switchTab('poem')">Gedicht / Text dichten</button>
      <button class="tab-btn" id="tabWordBtn" onclick="switchTab('word')">Einzelne Wörter reimen</button>
    </div>

    <!-- Modus 1: Gedicht & Lyrik -->
    <div id="poemMode">
      <div class="grid-3">
        <div>
          <label>Thema</label>
          <select id="poemTheme">
            <option value="Geburtstag">Geburtstag</option>
            <option value="Liebe & Romantik">Liebe & Romantik</option>
            <option value="Lustig & Frech">Lustig & Frech</option>
            <option value="Abschied">Abschied & Neuanfang</option>
            <option value="Natur & Poesie">Natur & Poesie</option>
            <option value="Freies Thema">Freies Thema</option>
          </select>
        </div>
        <div>
          <label>Gedichtform</label>
          <select id="poemStyle">
            <option value="Klassischer Paarreim (AABB)">Paarreim (AABB)</option>
            <option value="Kreuzreim (ABAB)">Kreuzreim (ABAB)</option>
            <option value="Haiku (5-7-5 Silben)">Haiku (Japanisch)</option>
            <option value="Elfchen (11 Wörter, 5 Zeilen)">Elfchen (5 Zeilen)</option>
            <option value="Freier Vers (ohne Reimzwang)">Freier Vers</option>
          </select>
        </div>
        <div>
          <label>Länge</label>
          <select id="poemLinesCount">
            <option value="2">2 Zeilen</option>
            <option value="4" selected>4 Zeilen (1 Strophe)</option>
            <option value="8">8 Zeilen (2 Strophen)</option>
            <option value="12">12 Zeilen (3 Strophen)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Worum geht es genau? (Name, Details)</label>
        <input type="text" id="poemDetails" placeholder="z. B. Für Jens, spielt gerne Jazz-Gitarre und fährt Camper">
      </div>

      <div class="form-group">
        <label>Pflichtwörter (optional)</label>
        <input type="text" id="poemKeywords" placeholder="z. B. Stratocaster, Bretagne, Holz">
      </div>

      <div class="grid-2">
        <div>
          <label>Eigene erste Zeile (optional)</label>
          <input type="text" id="poemFirstLine" placeholder="z. B. Der Camper rollt ans weite Meer...">
        </div>
        <div>
          <label>Sprache</label>
          <select id="poemLang">
            <option value="de" selected>Deutsch</option>
            <option value="en">Englisch</option>
            <option value="es">Spanisch</option>
            <option value="fr">Französisch</option>
          </select>
        </div>
      </div>

      <button class="submit-btn" onclick="generatePoem()">Werk erschaffen 🖋️</button>
    </div>

    <!-- Modus 2: Wortsuche -->
    <div id="wordMode" style="display: none;">
      <div class="grid-2">
        <div>
          <label>Suchwort</label>
          <input type="text" id="wordInput" placeholder="z. B. Sommer, Herz, Traum...">
        </div>
        <div>
          <label>Sprache</label>
          <select id="wordLang">
            <option value="de" selected>Deutsch</option>
            <option value="en">Englisch</option>
            <option value="es">Spanisch</option>
            <option value="fr">Französisch</option>
          </select>
        </div>
      </div>
      <button class="submit-btn" onclick="findRhymes()">Reime suchen 🔍</button>
    </div>
  </div>

  <div class="results" id="results"></div>

</div>

<script>
  let currentPoemText = "";

  function switchTab(tab) {
    document.getElementById('poemMode').style.display = tab === 'poem' ? 'block' : 'none';
    document.getElementById('wordMode').style.display = tab === 'word' ? 'block' : 'none';
    document.getElementById('tabPoemBtn').classList.toggle('active', tab === 'poem');
    document.getElementById('tabWordBtn').classList.toggle('active', tab === 'word');
    document.getElementById('results').innerHTML = '';
  }

  async function generatePoem() {
    const theme = document.getElementById('poemTheme').value;
    const style = document.getElementById('poemStyle').value;
    const linesCount = document.getElementById('poemLinesCount').value;
    const details = document.getElementById('poemDetails').value.trim();
    const keywords = document.getElementById('poemKeywords').value.trim();
    const firstLine = document.getElementById('poemFirstLine').value.trim();
    const lang = document.getElementById('poemLang').value;
    const container = document.getElementById('results');

    container.innerHTML = '<p class="empty">Die KI spitzt die Feder...</p>';

    const params = new URLSearchParams({ theme, poem_style: style, lines_count: linesCount, lang });
    if (details) params.append('details', details);
    if (keywords) params.append('keywords', keywords);
    if (firstLine) params.append('first_line', firstLine);

    try {
      const res = await fetch(`/api/generate-poem?${params.toString()}`);
      const data = await res.json();

      if (data.error || !data.poem_lines || data.poem_lines.length === 0) {
        container.innerHTML = `<p class="empty">Fehler: ${data.error || 'Konnte kein Gedicht erstellen.'}</p>`;
        return;
      }

      currentPoemText = data.poem_lines.join('\n');
      
      // Optisch Strophenabstände einbauen (bei 8 oder 12 Zeilen)
      let formattedHtml = '';
      data.poem_lines.forEach((line, index) => {
          formattedHtml += `<div>${line}</div>`;
          if ((index + 1) % 4 === 0 && index + 1 !== data.poem_lines.length && style.includes("Reim")) {
             formattedHtml += `<br>`; // Leerzeile nach jeder Strophe
          }
      });

      container.innerHTML = `
        <div class="category-block">
          <div class="category-title">
            <span>Dein Gedicht</span>
            <span>${style.split(' ')[0]} / ${data.poem_lines.length} Zeilen</span>
          </div>
          <div class="poem-box">${formattedHtml}</div>
          <div class="poem-action-bar">
            <button class="btn-secondary" onclick="speakText(currentPoemText, '${lang}')">🔊 Laut vorlesen</button>
            <button class="btn-secondary" onclick="copyPoem()">📋 Text kopieren</button>
          </div>
        </div>
      `;
    } catch (e) {
      container.innerHTML = '<p class="empty">Verbindungsfehler zum Server.</p>';
    }
  }

  function copyPoem() {
    navigator.clipboard.writeText(currentPoemText);
    alert("Kopiert!");
  }

  async function findRhymes() {
    const word = document.getElementById('wordInput').value.trim();
    const lang = document.getElementById('wordLang').value;
    const container = document.getElementById('results');

    if (!word) {
      container.innerHTML = '<p class="empty">Bitte gib ein Wort ein.</p>';
      return;
    }
    container.innerHTML = '<p class="empty">Suche Reime...</p>';

    try {
      const res = await fetch(`/api/rhyme?word=${encodeURIComponent(word)}&lang=${encodeURIComponent(lang)}`);
      const data = await res.json();
      const exact = data.categories?.exact || [];
      const multi = data.categories?.multisyllable || [];
      const near = data.categories?.near || [];

      let html = '';
      if (exact.length) html += renderWordBlock('Exakte Reime', exact, lang);
      if (multi.length) html += renderWordBlock('Mehrsilbige Reime', multi, lang);
      if (near.length) html += renderWordBlock('Halbreime', near, lang);

      container.innerHTML = html || '<p class="empty">Keine Reime gefunden.</p>';
    } catch (e) {
      container.innerHTML = '<p class="empty">Verbindungsfehler zum Server.</p>';
    }
  }

  function renderWordBlock(title, words, lang) {
    return `
      <div class="category-block">
        <div class="category-title">${title} (${words.length})</div>
        <div class="word-cloud">
          ${words.map(w => `
            <span class="word-chip">
              <span>${w}</span>
              <span class="speaker-btn" onclick="speakText('${w}', '${lang}')">🔊</span>
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }

  function speakText(text, lang) {
    if (!('speechSynthesis' in window)) return;
    const mapping = { de: 'de-DE', en: 'en-US', es: 'es-ES', fr: 'fr-FR' };
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = mapping[lang] || 'de-DE';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }
</script>

</body>
</html>
